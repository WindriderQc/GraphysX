<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphysX Explosion1 Particle Archive</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071018; }
      canvas { display: block; width: 100%; height: 100%; }
      .panel {
        position: fixed;
        left: 18px;
        top: 18px;
        max-width: min(560px, calc(100vw - 36px));
        padding: 14px 16px;
        border: 1px solid rgba(128, 211, 255, 0.32);
        border-radius: 12px;
        background: rgba(3, 12, 19, 0.78);
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.34);
        pointer-events: none;
      }
      h1 { margin: 0 0 6px; color: #e8f7ff; font-size: 17px; font-weight: 650; }
      p { margin: 3px 0; color: #a9c5d5; font-size: 12px; line-height: 1.45; }
      #particle-effect-status { color: #ffd283; }
    </style>
  </head>
  <body>
    <canvas id="particle-effect-canvas" aria-label="GraphysX Explosion1 particle effect preview"></canvas>
    <section class="panel">
      <h1>Explosion1.tvp — isolated GraphysX effect preset</h1>
      <p id="particle-effect-status">Loading byte-identical DDS textures…</p>
      <p>R restart · Space pause · A auto-replay · drag orbit · wheel zoom · F fullscreen</p>
      <p>Preset fields are exact; deterministic trajectories, Three.js blend mapping, floor and camera are disclosed adapters.</p>
    </section>
    <script type="module" src="/src/particle-effect-preview.ts"></script>
  </body>
</html>
