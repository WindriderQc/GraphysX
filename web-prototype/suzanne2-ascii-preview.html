<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" />
    <title>Suzanne 2 — isolated archive preview</title>
    <style>
      :root {
        color: #eaf7f0;
        background: #07111b;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      canvas:active {
        cursor: grabbing;
      }

      .archive-note {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        max-width: min(560px, calc(100vw - 64px));
        padding: 12px 14px;
        border: 1px solid rgba(112, 231, 197, 0.3);
        border-radius: 10px;
        background: rgba(3, 12, 19, 0.82);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
        pointer-events: none;
      }

      .archive-note strong,
      .archive-note span {
        display: block;
      }

      .archive-note strong {
        color: #70e7c5;
        font-size: 12px;
        letter-spacing: 0.12em;
      }

      .archive-note span {
        margin-top: 5px;
        color: rgba(234, 247, 240, 0.72);
        font-size: 11px;
        line-height: 1.45;
      }

      #suzanne2-preview-status {
        color: #f8d776;
      }
    </style>
  </head>
  <body>
    <div class="archive-note">
      <strong>SUZANNE 2 · ACTIVE 2017 SOURCE · NO SURVIVING SCREENSHOT</strong>
      <span id="suzanne2-preview-status">LOADING EXACT ASCII, XML, X-MESHES, AND TEXTURES…</span>
      <span>Drag to orbit · wheel to zoom · add <code>?camera=source2017</code> for the implemented camera.</span>
    </div>
    <canvas id="suzanne2-preview-canvas" aria-label="Suzanne 2 recovered isolated ASCII and XML environment"></canvas>
    <script type="module" src="/src/suzanne2-ascii-preview.ts"></script>
  </body>
</html>
