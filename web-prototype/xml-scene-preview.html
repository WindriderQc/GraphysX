<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'/>" />
    <title>MyWorld - Copie XML scene recovery</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #07101b;
        color: #eaf1f9;
        font: 14px/1.4 system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .evidence {
        position: fixed;
        z-index: 2;
        top: 16px;
        left: 16px;
        max-width: min(680px, calc(100vw - 64px));
        padding: 12px 14px;
        border: 1px solid #7fb8ee66;
        border-radius: 10px;
        background: #07111dde;
        box-shadow: 0 8px 32px #0008;
        pointer-events: none;
      }

      .evidence strong,
      .evidence span {
        display: block;
      }

      .evidence span {
        margin-top: 4px;
        color: #b8c8da;
      }
    </style>
  </head>
  <body>
    <canvas id="xml-scene-canvas" aria-label="Recovered MyWorld Copie XML scene"></canvas>
    <div class="evidence">
      <strong>MyWorld - Copie.xml · authored scene-builder test</strong>
      <span>6/7 recoverable objects · ArcheChinois asset absent · A/D or drag orbit · H toggles the airplane · F fullscreen</span>
    </div>
    <script type="module" src="/src/xml-scene-preview.ts"></script>
  </body>
</html>
